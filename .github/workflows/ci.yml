name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install (respects the 7-day age gate)
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Build
        run: |
          yarn build-chrome
          yarn build-firefox

      - name: E2E (real extension in headed Chromium via xvfb)
        run: |
          yarn playwright install --with-deps chromium
          xvfb-run -a yarn test:e2e

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: |
            chrome.zip
            firefox.zip
