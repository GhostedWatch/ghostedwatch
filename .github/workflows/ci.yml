name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Playwright has to support this image's Ubuntu to install Chromium: 1.60 failed on
    # 26.04, which ubuntu-latest became in 2026-11, and 1.65 added it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Node 26 has no Corepack. The runner's own yarn hands each command to the
      # Yarn this repo vendors (yarnPath in .yarnrc.yml).
      - name: Install (respects the 7-day age gate)
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Build
        run: |
          yarn build-chrome
          yarn build-firefox

      - name: E2E (real extension in headed Chromium via xvfb)
        run: |
          yarn build-chrome-dev
          yarn playwright install --with-deps chromium
          xvfb-run -a yarn test:e2e

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: |
            chrome.zip
            firefox.zip
