name: Release

# Tag a release to build and publish, e.g. `git tag v0.0.1 && git push --tags`.
# Requires these repository secrets:
#   Chrome Web Store: CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
#   Firefox AMO:      AMO_JWT_ISSUER, AMO_JWT_SECRET
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      # Node 26 has no Corepack. The runner's own yarn hands each command to the
      # Yarn this repo vendors (yarnPath in .yarnrc.yml).
      - run: yarn install --immutable

      - name: Verify the tag matches manifest.version
        run: |
          MANIFEST=$(node -p "require('./src/manifest.json').version")
          TAG=${GITHUB_REF_NAME#v}
          test "$MANIFEST" = "$TAG" || (echo "tag $TAG != manifest $MANIFEST" && exit 1)

      - run: yarn typecheck && yarn test && yarn build-chrome && yarn build-firefox

      # The publish scripts skip their interactive steps when CI is set. The
      # Chrome listing description still needs a manual paste in the dashboard
      # (the CWS API can't update text); AMO's description IS updated by API.
      - name: Publish to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node scripts/publishing/publish-chrome.mjs

      - name: Publish to Firefox AMO
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/publishing/publish-firefox.mjs

      - name: Attach zips to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chrome.zip
            firefox.zip
